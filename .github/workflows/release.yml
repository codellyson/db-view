# Cross-platform Tauri release matrix.
#
# Triggers:
#   - Pushing a tag matching `v*` (e.g. v0.1.0)        → builds + publishes
#     a draft GitHub Release with each platform's bundles attached.
#   - "Run workflow" button in the Actions tab         → builds bundles and
#     attaches them as workflow artifacts; no release is created.
#
# Outputs per platform:
#   - macOS (universal):  .dmg + .app   (in dmg/, macos/)
#   - Windows:            .exe (NSIS) + .msi (WiX)
#   - Linux:              .deb + .rpm + .AppImage
#
# Caveats:
#   - First build per platform is slow (5–15 min) because the release Cargo
#     profile turns on LTO and single-codegen-unit. Subsequent runs reuse
#     the rust-cache.
#   - Bundles are *unsigned*. macOS users will see Gatekeeper; Windows
#     users will see SmartScreen "unknown publisher". Signing requires
#     paid certs + secrets:
#       APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#       APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID  (for notarization)
#       WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#     Wire these as repo secrets and pass them through under `env:` once
#     you've got the certs.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build & (tag-only) publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On tag pushes, tauri-action creates a draft release and uploads
          # the bundles. On workflow_dispatch (no tag), tagName resolves to
          # the empty string and the release-publish step is skipped — the
          # bundles still land on disk and get picked up by the artifact
          # step below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'JustDB ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload bundles as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
