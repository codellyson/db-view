# Cross-platform Tauri release matrix.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary. We build both `app` and `dmg`:
          #   - `dmg` is what users download for fresh installs.
          #   - `app` is the loose .app bundle; Tauri tars + signs it to
          #     produce the .app.tar.gz the in-app updater consumes. Without
          #     `app` in the list, macOS users on a prior version can never
          #     auto-update — they have to revisit the releases page.
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          # Windows → both NSIS (.exe) and WiX (.msi). Tauri produces both
          # from the same build; --bundles just filters what gets emitted.
          - platform: windows-latest
            args: '--bundles nsis,msi'
          # Linux (.deb / .rpm / .AppImage) intentionally not built — not
          # part of the shipped lineup. Re-add a matrix entry here if that
          # changes.

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build & (tag-only) publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifacts (.tar.gz + .sig + latest.json) are only produced
          # when both signing secrets are set on the repo. Without them the
          # build still succeeds but skips the updater files — useful for
          # initial CI runs before you've generated the keypair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the binary via option_env! in src-tauri/src/lib.rs.
          # When unset (e.g. local dev builds), telemetry is fully disabled —
          # the Aptabase plugin isn't even registered.
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        with:
          # On tag pushes, tauri-action creates a draft release and uploads
          # the bundles. On workflow_dispatch (no tag), tagName resolves to
          # the empty string and the release-publish step is skipped — the
          # bundles still land on disk and get picked up by the artifact
          # step below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'JustDB ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload bundles as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
