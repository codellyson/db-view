# On every release tag, regenerate CHANGELOG.md, commit it back to main,
# and attach the unreleased delta to the GitHub Release body so users see
# the right notes without us having to hand-curate the release.

name: Changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use a PAT or the default token; we push back to main below.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generates only the section for THIS tag — used as Release body.
      - name: Generate release notes for this tag
        uses: orhun/git-cliff-action@v4
        id: release-notes
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: CHANGES.md

      # The release script (scripts/release.sh) already prepends the new
      # section to CHANGELOG.md before pushing the tag, so this step only
      # runs as a safety net for tags pushed by hand. --prepend preserves
      # any manual polish on past release sections.
      #
      # It must be skipped when the section is already there: HEAD is the
      # tag at this point, so --unreleased matches no commits (the
      # chore(release) commit is skip = true in cliff.toml) and git-cliff
      # prepends a bare heading with nothing under it — which is how every
      # release up to v0.2.1 ended up with its heading written twice.
      - name: Is this tag's section already in CHANGELOG.md?
        id: section
        run: |
          if grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure $TAG section is in CHANGELOG.md
        if: steps.section.outputs.present == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --unreleased --prepend CHANGELOG.md

      - name: Attach notes to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
          append_body: true

      - name: Commit CHANGELOG.md back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, skipping commit."
            exit 0
          fi
          git checkout main
          git add CHANGELOG.md
          git commit -m "chore(changelog): update for ${GITHUB_REF_NAME}"
          git push origin main
