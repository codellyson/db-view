# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to JustDB are documented here. Format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/); versioning follows
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# Render an entry per release. `version` resolves to the git tag (e.g.
# v0.1.6) when generating for a tagged release, or `Unreleased` when running
# in --unreleased mode.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/codellyson/justdb/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Map commit prefixes to changelog sections. Order here drives display order.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  # `style:` here means a visible interface change, not source formatting.
  { message = "^style", group = "Changed" },
  { message = "^test", skip = true },
  { message = "^docs", group = "Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Maintenance" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", skip = true },
]
# Skip release/version-bump commits and merge commits — they're noise.
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = ""
# Anything before v0.1.6 was a pre-public dev release with messy commit
# messages and no audience reading the notes. Drop those sections from
# both CHANGELOG.md and the marketing /changelog page.
ignore_tags = "^v0\\.(0\\..*|1\\.[0-5])$"
topo_order = false
sort_commits = "oldest"
